<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Нийгмийн ухааны тест үүсгэгч</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

.info {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

button {
    display: block;
    margin: 25px auto;
    padding: 14px 30px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
}

.question {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.answer {
    margin: 10px 0;
}

#result {
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 Нийгмийн ухааны тестийн сан</h1>

<p class="info">
Санамсаргүй асуулт сонгон шалгалтын материал үүсгэгч
</p>

<button id="generateButton">
🎲 Шалгалт үүсгэх
</button>

<div id="result"></div>

</div>

<script>

const questions = [
    {
        question: "Монгол Улс НҮБ-д хэдэн онд элссэн бэ?",
        answers: [
            "1945 он",
            "1955 он",
            "1961 он",
            "1971 он"
        ]
    },

    {
        question: "Соёлын үндсэн бүрэлдэхүүнд аль нь хамаарах вэ?",
        answers: [
            "Хэл",
            "Бэлгэдэл",
            "Үнэт зүйл",
            "Дээрх бүгд"
        ]
    },

    {
        question: "Нийгэм гэж юу вэ?",
        answers: [
            "Зөвхөн хүмүүсийн бөөгнөрөл",
            "Харилцан үйлдэл бүхий хүмүүсийн тогтолцоо",
            "Зөвхөн гэр бүл",
            "Зөвхөн төр"
        ]
    },

    {
        question: "Инфляци гэж юу вэ?",
        answers: [
            "Бараа үйлчилгээний үнийн ерөнхий түвшин өсөх",
            "Ажилгүйдэл буурах",
            "Цалин буурах",
            "Экспорт нэмэгдэх"
        ]
    },

    {
        question: "Монгол Улсын Үндсэн хууль хэдэн онд батлагдсан бэ?",
        answers: [
            "1924 он",
            "1940 он",
            "1960 он",
            "1992 он"
        ]
    },

    {
        question: "Нийгмийн давхраажилт гэж юу вэ?",
        answers: [
            "Нийгмийн бүлгүүдийн ялгарал",
            "Зөвхөн насны ялгаа",
            "Зөвхөн хүйсийн ялгаа",
            "Зөвхөн хэлний ялгаа"
        ]
    },

    {
        question: "Ардчиллын үндсэн зарчмын нэг аль вэ?",
        answers: [
            "Иргэдийн оролцоо",
            "Нэг хүний эрх мэдэл",
            "Цэргийн засаглал",
            "Хаант засаглал"
        ]
    },

    {
        question: "Ажилгүйдэл гэж юу вэ?",
        answers: [
            "Ажиллах хүсэлгүй байх",
            "Ажиллах чадвартай, ажиллах хүсэлтэй боловч ажилгүй байх",
            "Бүх хүн ажилгүй байх",
            "Сургуульд сурах"
        ]
    },

    {
        question: "Эдийн засгийн үндсэн нөөцийн нэг аль вэ?",
        answers: [
            "Газар",
            "Зөвхөн мөнгө",
            "Зөвхөн компьютер",
            "Зөвхөн үйлдвэр"
        ]
    },

    {
        question: "Хүний эрхийн үндсэн шинж аль вэ?",
        answers: [
            "Хүн бүрт хамаарна",
            "Зөвхөн баян хүнд хамаарна",
            "Зөвхөн төрийн албан хаагчид хамаарна",
            "Зөвхөн насанд хүрэгчдэд хамаарна"
        ]
    }
];


function shuffle(array) {

    let newArray = array.slice();

    for (let i = newArray.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        let temp = newArray[i];

        newArray[i] = newArray[j];

        newArray[j] = temp;
    }

    return newArray;
}


function generateTest() {

    let selected = shuffle(questions).slice(0, 5);

    let html = "<h2>📝 Шалгалтын материал</h2>";

    selected.forEach(function(q, index) {

        html += "<div class='question'>";

        html += "<h3>";
        html += (index + 1) + ". " + q.question;
        html += "</h3>";

        q.answers.forEach(function(answer, i) {

            html += "<div class='answer'>";
            html += String.fromCharCode(65 + i) + ". " + answer;
            html += "</div>";

        });

        html += "</div>";

    });

    html += "<button onclick='window.print()'>";
    html += "🖨️ Хэвлэх";
    html += "</button>";

    document.getElementById("result").innerHTML = html;
}


document.getElementById("generateButton").addEventListener(
    "click",
    generateTest
);

</script>

</body>
</html>
