<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Нийгмийн ухааны тестийн сан</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

.info {
    text-align: center;
    color: #555;
}

.settings {
    background: #f7f8fa;
    padding: 20px;
    border-radius: 12px;
    margin-top: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    display: block;
    margin: 25px auto;
    padding: 14px 30px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
}

.question {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.answer {
    margin: 10px 0;
}

#result {
    margin-top: 30px;
}

#adminPanel {
    display: none;
    margin-top: 30px;
    padding: 25px;
    background: #f1f5f9;
    border-radius: 15px;
}

.message {
    text-align: center;
    font-weight: bold;
}

@media print {
    .settings,
    #adminLoginButton,
    #printButton,
    #adminPanel {
        display: none !important;
    }

    body {
        background: white;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📚 Нийгмийн ухааны тестийн сан</h1>

<button id="adminLoginButton" onclick="adminLogin()">
🔐 Админ нэвтрэх
</button>

<p class="info">
Санамсаргүй асуулт сонгон шалгалтын материал үүсгэгч
</p>

<div class="settings">

<label>📘 Анги сонгох</label>

<select id="grade">
    <option value="9">9-р анги</option>
    <option value="10">10-р анги</option>
    <option value="11">11-р анги</option>
    <option value="12">12-р анги</option>
</select>

<label>📚 Сэдэв сонгох</label>

<select id="topic">
    <option value="culture">Соёл</option>
    <option value="society">Нийгэм</option>
    <option value="economy">Эдийн засаг</option>
    <option value="politics">Улс төр</option>
    <option value="law">Эрх зүй</option>
    <option value="history">Түүх</option>
</select>

<label>📝 Асуултын тоо</label>

<select id="questionCount">
    <option value="5">5 асуулт</option>
    <option value="10">10 асуулт</option>
    <option value="20">20 асуулт</option>
</select>

<button id="generateButton">
🎲 Шалгалт үүсгэх
</button>

</div>

<div id="result"></div>

<div id="adminPanel">

<h2>🔐 Админ самбар</h2>

<p>Эндээс тестийн сангаа удирдана.</p>

<hr>

<h3>➕ Шинэ асуулт нэмэх</h3>

<label>Анги</label>

<select id="adminGrade">
    <option value="9">9-р анги</option>
    <option value="10">10-р анги</option>
    <option value="11">11-р анги</option>
    <option value="12">12-р анги</option>
</select>

<label>Сэдэв</label>

<select id="adminTopic">
    <option value="culture">Соёл</option>
    <option value="society">Нийгэм</option>
    <option value="economy">Эдийн засаг</option>
    <option value="politics">Улс төр</option>
    <option value="law">Эрх зүй</option>
    <option value="history">Түүх</option>
</select>

<label>Асуулт</label>
<input id="adminQuestion" type="text">

<label>A хариулт</label>
<input id="answerA" type="text">

<label>B хариулт</label>
<input id="answerB" type="text">

<label>C хариулт</label>
<input id="answerC" type="text">

<label>D хариулт</label>
<input id="answerD" type="text">

<label>Зөв хариулт</label>

<select id="correctAnswer">
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
    <option value="D">D</option>
</select>

<button onclick="addQuestion()">
💾 Асуулт хадгалах
</button>

<p id="adminMessage" class="message"></p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://eejwmzgcwmfyasbctilt.supabase.co/rest/v1/;

const SUPABASE_KEY =
sb_publishable_J8Qgh7mZeHRLW0yyuEbWNg_MK0qr1rX;

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* АСУУЛТЫН САН */

let questions = [];


/* DATABASE-ААС УНШИХ */

async function loadQuestions() {

    const { data, error } =
        await supabaseClient
        .from("questions")
        .select("*");

    if (error) {

        console.error(
            "Supabase алдаа:",
            error
        );

           alert("❌ Supabase алдаа: " + error.message);
        );

        return;
    }

    questions = data.map(function(q) {

        return {
            id: q.id,
            grade: q.grade,
            topic: q.topic,
            question: q.question,

            answers: [
                q.answer_a,
                q.answer_b,
                q.answer_c,
                q.answer_d
            ],

            correct: q.correct_answer
        };

    });

    console.log(
        "Database-ийн асуултын тоо:",
        questions.length
    );
}


/* RANDOM */

function shuffle(array) {

    let newArray =
        array.slice();

    for (
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        let temp =
            newArray[i];

        newArray[i] =
            newArray[j];

        newArray[j] =
            temp;
    }

    return newArray;
}


/* ШАЛГАЛТ ҮҮСГЭХ */

function generateTest() {

    let grade =
        document.getElementById(
            "grade"
        ).value;

    let topic =
        document.getElementById(
            "topic"
        ).value;

    let count =
        Number(
            document.getElementById(
                "questionCount"
            ).value
        );

    let filtered =
        questions.filter(function(q) {

            return (
                q.grade === grade &&
                q.topic === topic
            );

        });

    if (filtered.length === 0) {

        document.getElementById(
            "result"
        ).innerHTML =

        "<h2>⚠️ Асуулт олдсонгүй.</h2>" +

        "<p>" +
        "Сонгосон анги болон сэдвийн database-д асуулт алга." +
        "</p>";

        return;
    }

    let selected =
        shuffle(filtered).slice(
            0,
            Math.min(
                count,
                filtered.length
            )
        );

    let html =
        "<h2>📝 Шалгалтын материал</h2>";

    selected.forEach(
        function(q, index) {

            html +=
                "<div class='question'>";

            html +=
                "<h3>" +
                (index + 1) +
                ". " +
                q.question +
                "</h3>";

            q.answers.forEach(
                function(answer, i) {

                    html +=
                    "<div class='answer'>" +
                    String.fromCharCode(65 + i) +
                    ". " +
                    answer +
                    "</div>";

                }
            );

            html +=
                "</div>";
        }
    );

    html +=
    "<button id='printButton' onclick='window.print()'>" +
    "🖨️ Хэвлэх" +
    "</button>";

    document.getElementById(
        "result"
    ).innerHTML = html;
}


/* АДМИН НЭВТРЭЛТ */

function adminLogin() {

    let password =
        prompt(
            "🔐 Админы нууц үгээ оруулна уу:"
        );

    if (password === "1234") {

        document.getElementById(
            "adminPanel"
        ).style.display =
            "block";

        alert(
            "✅ Админ хэсэгт амжилттай нэвтэрлээ!"
        );

        document.getElementById(
            "adminPanel"
        ).scrollIntoView({
            behavior: "smooth"
        });

    } else {

        alert(
            "❌ Нууц үг буруу байна."
        );
    }
}


/* DATABASE-Д АСУУЛТ НЭМЭХ */

async function addQuestion() {

    let grade =
        document.getElementById(
            "adminGrade"
        ).value;

    let topic =
        document.getElementById(
            "adminTopic"
        ).value;

    let question =
        document.getElementById(
            "adminQuestion"
        ).value;

    let answerA =
        document.getElementById(
            "answerA"
        ).value;

    let answerB =
        document.getElementById(
            "answerB"
        ).value;

    let answerC =
        document.getElementById(
            "answerC"
        ).value;

    let answerD =
        document.getElementById(
            "answerD"
        ).value;

    let correct =
        document.getElementById(
            "correctAnswer"
        ).value;

    if (
        question.trim() === "" ||
        answerA.trim() === "" ||
        answerB.trim() === "" ||
        answerC.trim() === "" ||
        answerD.trim() === ""
    ) {

        alert(
            "⚠️ Асуулт болон бүх хариултыг бөглөнө үү."
        );

        return;
    }

    const { data, error } =
        await supabaseClient
        .from("questions")
        .insert({

            grade: grade,
            topic: topic,
            question: question,
            answer_a: answerA,
            answer_b: answerB,
            answer_c: answerC,
            answer_d: answerD,
            correct_answer: correct

        })
        .select();

    if (error) {

        console.error(
            "Insert error:",
            error
        );

        document.getElementById(
            "adminMessage"
        ).innerHTML =
        "❌ Database-д хадгалж чадсангүй.";

        return;
    }

    document.getElementById(
        "adminMessage"
    ).innerHTML =
    "✅ Асуулт database-д амжилттай хадгалагдлаа!";

    document.getElementById(
        "adminQuestion"
    ).value = "";

    document.getElementById(
        "answerA"
    ).value = "";

    document.getElementById(
        "answerB"
    ).value = "";

    document.getElementById(
        "answerC"
    ).value = "";

    document.getElementById(
        "answerD"
    ).value = "";

    await loadQuestions();
}


/* ЭХЛЭХ */

document
.getElementById("generateButton")
.addEventListener(
    "click",
    generateTest
);

loadQuestions();
</script>
</body>
</html>
