<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Нийгмийн ухааны тестийн сан</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

.info {
    text-align: center;
    color: #555;
}

.settings {
    background: #f7f8fa;
    padding: 20px;
    border-radius: 12px;
    margin-top: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    font-size: 16px;
}

button {
    display: block;
    margin: 25px auto;
    padding: 14px 30px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
}

.question {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.answer {
    margin: 10px 0;
}

#result {
    margin-top: 30px;
}

@media print {

    .settings,
    #generateButton,
    #printButton {
        display: none;
    }

    body {
        background: white;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>📚 Нийгмийн ухааны тестийн сан</h1>
<button onclick="adminLogin()">🔐 Админ нэвтрэх</button>
<p class="info">
Санамсаргүй асуулт сонгон шалгалтын материал үүсгэгч
</p>


<div class="settings">

<label>📘 Анги сонгох</label>

<select id="grade">

<option value="9">9-р анги</option>
<option value="10">10-р анги</option>
<option value="11">11-р анги</option>
<option value="12">12-р анги</option>

</select>


<label>📚 Сэдэв сонгох</label>

<select id="topic">

<option value="culture">Соёл</option>
<option value="society">Нийгэм</option>
<option value="economy">Эдийн засаг</option>
<option value="politics">Улс төр</option>
<option value="law">Эрх зүй</option>
<option value="history">Түүх</option>

</select>


<label>📝 Асуултын тоо</label>

<select id="questionCount">

<option value="5">5 асуулт</option>
<option value="10">10 асуулт</option>
<option value="20">20 асуулт</option>

</select>


<button id="generateButton">
🎲 Шалгалт үүсгэх
</button>

</div>


<div id="result"></div>


</div>


<script>


const questions = [

{
grade: "10",
topic: "culture",

question: "Соёл гэж юу вэ?",

answers: [
"Хүмүүсийн бүтээсэн материаллаг болон оюуны үнэт зүйлсийн цогц",
"Зөвхөн урлаг",
"Зөвхөн хэл",
"Зөвхөн уламжлал"
]

},


{
grade: "10",
topic: "culture",

question: "Соёлыг бүрдүүлэгч үндсэн элементүүдийн нэг аль вэ?",

answers: [
"Бэлгэдэл",
"Мөнгө",
"Банк",
"Татвар"
]

},


{
grade: "10",
topic: "culture",

question: "Хэл соёлд ямар үүрэгтэй вэ?",

answers: [
"Мэдээлэл, утга санааг дамжуулна",
"Зөвхөн бичиг баримт хадгална",
"Зөвхөн худалдаанд хэрэглэнэ",
"Ямар ч үүрэггүй"
]

},


{
grade: "10",
topic: "society",

question: "Нийгэм гэж юу вэ?",

answers: [
"Хүмүүсийн харилцан үйлдэл бүхий тогтолцоо",
"Зөвхөн гэр бүл",
"Зөвхөн төр",
"Зөвхөн сургууль"
]

},


{
grade: "10",
topic: "society",

question: "Нийгмийн давхраажилт гэж юу вэ?",

answers: [
"Нийгмийн бүлгүүдийн байр суурь, нөөцийн ялгарал",
"Зөвхөн насны ялгаа",
"Зөвхөн хэлний ялгаа",
"Зөвхөн газар нутгийн ялгаа"
]

},


{
grade: "11",
topic: "economy",

question: "Инфляци гэж юу вэ?",

answers: [
"Бараа үйлчилгээний үнийн ерөнхий түвшин өсөх",
"Цалин заавал буурах",
"Ажилгүйдэл бүрэн арилгах",
"Экспорт буурах"
]

},


{
grade: "11",
topic: "economy",

question: "Эдийн засгийн үндсэн нөөцийн нэг аль вэ?",

answers: [
"Газар",
"Зөвхөн мөнгө",
"Зөвхөн компьютер",
"Зөвхөн банк"
]

},


{
grade: "11",
topic: "economy",

question: "Ажилгүйдэл гэж юу вэ?",

answers: [
"Ажиллах чадвартай, ажиллах хүсэлтэй боловч ажилгүй байх",
"Сургуульд сурах",
"Ажиллах хүсэлгүй байх",
"Бүх хүн ажилгүй байх"
]

},


{
grade: "11",
topic: "politics",

question: "Ардчиллын үндсэн зарчмын нэг аль вэ?",

answers: [
"Иргэдийн оролцоо",
"Нэг хүний эрх мэдэл",
"Цэргийн засаглал",
"Хаант засаглал"
]

},


{
grade: "12",
topic: "law",

question: "Хүний эрхийн үндсэн шинж аль вэ?",

answers: [
"Хүн бүрт хамаарна",
"Зөвхөн баян хүнд хамаарна",
"Зөвхөн төрийн албан хаагчид хамаарна",
"Зөвхөн насанд хүрэгчдэд хамаарна"
]

},


{
grade: "10",
topic: "history",

question: "Монгол Улс НҮБ-д хэдэн онд элссэн бэ?",

answers: [
"1945 он",
"1955 он",
"1961 он",
"1971 он"
]

},


{
grade: "10",
topic: "history",

question: "Монгол Улсын Үндсэн хууль хэдэн онд батлагдсан бэ?",

answers: [
"1924 он",
"1940 он",
"1960 он",
"1992 он"
]

}

];


function shuffle(array) {

let newArray = array.slice();

for (let i = newArray.length - 1; i > 0; i--) {

let j = Math.floor(Math.random() * (i + 1));

let temp = newArray[i];

newArray[i] = newArray[j];

newArray[j] = temp;

}

return newArray;

}


function generateTest() {


let grade =
document.getElementById("grade").value;


let topic =
document.getElementById("topic").value;


let count =
Number(document.getElementById("questionCount").value);


let filtered =
questions.filter(function(q) {

return q.grade === grade &&
       q.topic === topic;

});


if (filtered.length === 0) {

document.getElementById("result").innerHTML =

"<h2>⚠️ Энэ ангид сонгосон сэдвийн асуулт одоогоор алга.</h2>" +

"<p>Өөр анги эсвэл өөр сэдэв сонгоно уу.</p>";

return;

}


let selected =
shuffle(filtered).slice(
0,
Math.min(count, filtered.length)
);


let html =
"<h2>📝 Шалгалтын материал</h2>";


selected.forEach(function(q, index) {


html +=
"<div class='question'>";


html +=
"<h3>" +
(index + 1) +
". " +
q.question +
"</h3>";


q.answers.forEach(function(answer, i) {


html +=
"<div class='answer'>" +

String.fromCharCode(65 + i) +

". " +

answer +

"</div>";


});


html +=
"</div>";


});


html +=

"<button id='printButton' onclick='window.print()'>" +

"🖨️ Хэвлэх" +

"</button>";


document.getElementById("result").innerHTML =
html;

}


document.getElementById("generateButton")
.addEventListener(
"click",
generateTest
);


</script>
<button onclick="adminLogin()">🔐 Админ нэвтрэх</button>

<script>
function adminLogin() {
    let password = prompt("🔐 Админы нууц үгээ оруулна уу:");

    if (password === "1234") {
        alert("✅ Админ хэсэгт нэвтэрлээ!");
    } else {
        alert("❌ Нууц үг буруу байна.");
    }
}
</script>
</body>
</html>
