function shuffle(array) {

let newArray = array.slice();

for (let i = newArray.length - 1; i > 0; i--) {

let j = Math.floor(Math.random() * (i + 1));

let temp = newArray[i];

newArray[i] = newArray[j];

newArray[j] = temp;

}

return newArray;

}


function generateTest() {


let grade =
document.getElementById("grade").value;


let topic =
document.getElementById("topic").value;


let count =
Number(document.getElementById("questionCount").value);


let filtered =
questions.filter(function(q) {

return q.grade === grade &&
       q.topic === topic;

});


if (filtered.length === 0) {

document.getElementById("result").innerHTML =

"<h2>⚠️ Энэ ангид сонгосон сэдвийн асуулт одоогоор алга.</h2>" +

"<p>Өөр анги эсвэл өөр сэдэв сонгоно уу.</p>";

return;

}


let selected =
shuffle(filtered).slice(
0,
Math.min(count, filtered.length)
);


let html =
"<h2>📝 Шалгалтын материал</h2>";


selected.forEach(function(q, index) {


html +=
"<div class='question'>";


html +=
"<h3>" +
(index + 1) +
". " +
q.question +
"</h3>";


q.answers.forEach(function(answer, i) {


html +=
"<div class='answer'>" +

String.fromCharCode(65 + i) +

". " +

answer +

"</div>";


});


html +=
"</div>";


});


html +=

"<button id='printButton' onclick='window.print()'>" +

"🖨️ Хэвлэх" +

"</button>";


document.getElementById("result").innerHTML =
html;

}

.addEventListener(
"click",
generateTest
);

    <script>
function addQuestion() {

    let grade = document.getElementById("adminGrade").value;
    let topic = document.getElementById("adminTopic").value;
    let question = document.getElementById("adminQuestion").value;

    let answers = [
        document.getElementById("answerA").value,
        document.getElementById("answerB").value,
        document.getElementById("answerC").value,
        document.getElementById("answerD").value
    ];

    let correct = Number(
        document.getElementById("correctAnswer").value
    );

    if (
        question.trim() === "" ||
        answers.some(function(a) {
            return a.trim() === "";
        })
    ) {
        alert("⚠️ Асуулт болон бүх хариултыг бөглөнө үү.");
        return;
    }

    questions.push({
        grade: grade,
        topic: topic,
        question: question,
        answers: answers,
        correct: correct
    });

    document.getElementById("adminMessage").innerHTML =
        "✅ Асуулт амжилттай нэмэгдлээ!";

    document.getElementById("adminQuestion").value = "";
    document.getElementById("answerA").value = "";
    document.getElementById("answerB").value = "";
    document.getElementById("answerC").value = "";
    document.getElementById("answerD").value = "";
}
</script>
